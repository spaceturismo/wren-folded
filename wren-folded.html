<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wren, Folded</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one framed room with a title bar above and an instrument row below; notes and cards float over the room.
   Look: a single committed dark world. The room has two sides: near (deep teal-black) and far (pale frost, inverted). */
:root {
  --void: #060b0e;
  --near-bg: #081317;
  --near-line: #8cc9c0;
  --far-bg: #cfdde0;
  --far-ink: #12303a;
  --lantern: #ffa24d;
  --text: #d7ebe6;
  --muted: #7ea39d;
  --edge: rgba(140, 201, 192, 0.3);
  --card: #0a1a1f;
  --display: 'Bodoni Moda', 'Bodoni 72', Didot, Georgia, serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: var(--void); }
body {
  background: var(--void);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 {
  margin: 0;
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(1.7rem, 4.5vw, 2.5rem);
  letter-spacing: -0.01em;
  line-height: 1.1;
  text-wrap: balance;
}
.lvl, .side, .eyebrow, .btn, .hint, .toast {
  font-family: var(--mono);
}
.lvl { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

.stage {
  position: relative;
  aspect-ratio: 8 / 5;
  width: 100%;
  background: var(--near-bg);
  border: 1px solid var(--edge);
  overflow: hidden;
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

.toast {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translate(-50%, -6px);
  max-width: 90%;
  padding: 8px 12px;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-align: center;
  background: rgba(6, 11, 14, 0.82);
  color: var(--text);
  border: 1px solid var(--edge);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s, transform 0.35s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  padding: 16px;
  background: rgba(5, 10, 12, 0.62);
  backdrop-filter: blur(2px);
  z-index: 5;
  overflow: auto;
}
.card {
  margin: auto;
  width: 100%;
  max-width: 540px;
  display: grid;
  gap: 14px;
  padding: 26px 28px 24px;
  background: var(--card);
  border: 1px solid var(--edge);
  justify-items: start;
}
.eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.ctitle {
  margin: 0;
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(2rem, 6vw, 3.1rem);
  line-height: 1.05;
  text-wrap: balance;
}
.note {
  margin: 0;
  font-family: var(--display);
  font-style: italic;
  font-size: clamp(1.08rem, 2.6vw, 1.42rem);
  line-height: 1.42;
  text-wrap: pretty;
}
.copy { margin: 0; color: var(--text); max-width: 46ch; }
.copy.dim { color: var(--muted); font-size: 13.5px; }

.btn {
  min-height: 44px;
  padding: 11px 18px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--lantern);
  background: transparent;
  border: 1px solid var(--lantern);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.btn:hover { background: var(--lantern); color: #1a0f05; }
.btn.ghost { color: var(--muted); border-color: var(--edge); }
.btn.ghost:hover { background: rgba(140, 201, 192, 0.14); color: var(--text); }
:focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; }

form { display: grid; gap: 10px; width: 100%; justify-items: start; }
input[type="text"] {
  width: 100%;
  min-height: 46px;
  padding: 10px 14px;
  font-family: var(--display);
  font-style: italic;
  font-size: 1.3rem;
  color: var(--text);
  background: rgba(140, 201, 192, 0.07);
  border: 1px solid var(--edge);
  border-radius: 0;
}
input[type="text"]::placeholder { color: var(--muted); opacity: 0.8; }

.hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 22px; }
.ticks { display: flex; align-items: center; gap: 14px; padding-inline: 4px; }
.tick { width: 10px; height: 10px; border: 1px solid var(--muted); transform: rotate(45deg); transition: background 0.4s, box-shadow 0.4s; }
.tick.on { background: var(--lantern); border-color: var(--lantern); box-shadow: 0 0 12px rgba(255, 162, 77, 0.65); }
.side { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.side b { font-weight: 500; color: var(--text); margin-left: 6px; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px; }
.hint { margin: 0; min-height: 3.2em; font-size: 12.5px; line-height: 1.6; color: var(--muted); max-width: 78ch; }

@media (max-width: 640px) {
  .overlay {
    position: fixed;
    background: rgba(5, 10, 12, 0.95);
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .card { padding: 20px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .tick, .btn { transition: none; }
}
</style>

<main class="wrap">
  <header class="bar">
    <h1>Wren, Folded</h1>
    <div class="lvl" id="lvl" aria-live="polite"></div>
  </header>

  <section class="stage" id="stage" aria-label="The room">
    <canvas id="c" role="img" aria-label="A small child carrying a lantern, in a room that exists from two sides."></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="card" id="card" role="dialog" aria-modal="true"></div>
    </div>
  </section>

  <section class="hud">
    <div class="ticks" id="ticks" role="img" aria-label="Notes found: 0 of 5"></div>
    <div class="side">Side<b id="side">Near</b></div>
    <div class="ctl">
      <button class="btn" id="turnBtn" type="button">Turn</button>
      <button class="btn ghost" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    </div>
  </section>
  <p class="hint" id="hint"></p>
</main>

<script>
(() => {
'use strict';
const W = 800, H = 500;
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d'), stage = $('stage');
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- colour helpers ---------- */
const COL = { A: { bg: '#081317', line: '#8cc9c0' }, B: { bg: '#cfdde0', line: '#12303a' } };
const parse = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, t) => { const x = parse(a), y = parse(b); return x.map((v, i) => v + (y[i] - v) * t); };
const mixArr = (x, y, t) => x.map((v, i) => v + (y[i] - v) * t);
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- levels ---------- */
// wall: [x, y, w, h, planes]  planes: 'A' near side only, 'B' far side only, 'AB' both
const BORDER = [[0, 0, 800, 20, 'AB'], [0, 480, 800, 20, 'AB'], [0, 0, 20, 500, 'AB'], [780, 0, 20, 500, 'AB']];
const P = (x, y) => [x, y, 26, 26, 'AB'];

const LEVELS = [
  {
    name: 'I · The Threshold',
    hint: 'Tap or click to walk, or use the arrow keys. Press Space, or Turn, to see the room from its other side. Some walls exist on only one side.',
    start: [90, 250],
    walls: [[390, 20, 20, 460, 'A'], P(150, 110), P(200, 370), P(560, 120), P(620, 380), [100, 400, 80, 16, 'B']],
    frag: { x: 620, y: 250, p: 'A' },
    portal: { x: 745, y: 250 },
    note: 'Hello. Somebody is moving me, and I think it is you. That is all right. The floor here is only the floor in one direction. Turn, and it becomes something else.'
  },
  {
    name: 'II · Two Kinds of Wall',
    hint: 'Walls come in two kinds. When the wall ahead is not there on the other side, turn and walk through it.',
    start: [80, 250],
    walls: [[220, 20, 20, 460, 'A'], [420, 20, 20, 460, 'B'], [620, 20, 20, 460, 'A'],
      P(120, 100), P(120, 370), P(320, 150), P(320, 330), P(520, 100), P(520, 380), P(700, 110), P(700, 370)],
    frag: { x: 520, y: 250, p: 'A' },
    portal: { x: 745, y: 250 },
    note: 'Everything here is what you have there, turned a little. Even the walls. Especially the walls. I think that is why I was never afraid.'
  },
  {
    name: 'III · The Extra Door',
    hint: 'A closed room can still be entered. The faint outlines are what the other side is holding.',
    start: [80, 250],
    walls: [[300, 150, 200, 16, 'A'], [300, 334, 200, 16, 'A'], [300, 150, 16, 200, 'A'], [484, 150, 16, 200, 'A'],
      [600, 20, 20, 460, 'B'], P(160, 110), P(160, 370), P(680, 380)],
    frag: { x: 400, y: 250, p: 'B' },
    portal: { x: 745, y: 250 },
    watcher: { x: 690, y: 150, h: 90 },
    note: 'I counted the doors again. There is always one more than I count. I used to think that was a mistake. I think now that it is the one you are using.'
  },
  {
    name: 'IV · The Far Light',
    hint: 'The far side is bright and does not like to be stayed in. Watch the ring around the lantern. Rest in the hollows.',
    start: [70, 250],
    walls: [[280, 20, 400, 185, 'AB'], [280, 295, 400, 185, 'AB'], [280, 205, 400, 20, 'A'], [280, 275, 400, 20, 'A'],
      [280, 225, 20, 50, 'A'], [350, 225, 100, 50, 'A'], [500, 225, 100, 50, 'A'], [650, 225, 30, 50, 'A'],
      P(130, 110), P(130, 370)],
    frag: { x: 705, y: 110, p: 'A' },
    portal: { x: 745, y: 190 },
    watcher: { x: 735, y: 470, h: 230 },
    pressure: true,
    note: 'The tall one is not unkind. It is only far away, and learning to be near. It stood very still while you walked past. Thank you for not running.'
  },
  {
    name: 'V · The Held Door',
    hint: 'It is only standing there. Go to the small light at its feet.',
    start: [80, 250],
    walls: [[380, 20, 20, 460, 'A'], P(180, 130), P(180, 360), P(520, 120), P(520, 370)],
    frag: { x: 600, y: 250, p: 'B' },
    door: { x: 745, y: 250 },
    watcher: { x: 675, y: 470, h: 300 },
    note: 'I could have gone through, a long time ago. I stay because someone has to hold it open, and nobody else knows how. You may as well know that I never told anyone my name, because nobody asked. Will you give me one? I will answer to it when you arrive.'
  }
];

/* ---------- state ---------- */
let li = 0, L = LEVELS[0], walls = BORDER.concat(L.walls);
let plane = 'A', blend = 0, target = null, stuck = 0;
let mode = 'card';                       // 'play' | 'card' | 'fade'
const child = { x: 90, y: 250 };
const trail = [];
const frags = [false, false, false, false, false];
let portalOpen = false, pressure = 0, shake = 0, t = 0;
let fade = 0, fadeDir = 0, pending = null;
const keys = {};
let soundOn = true;

/* ---------- audio ---------- */
let AC = null, master = null, drone = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = soundOn ? 0.9 : 0;
    master.connect(AC.destination);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
    const dg = AC.createGain(); dg.gain.value = 0.05;
    lp.connect(dg); dg.connect(master);
    const o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
    const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 82.6; o2.detune.value = 7;
    o1.connect(lp); o2.connect(lp); o1.start(); o2.start();
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.08;
    const lg = AC.createGain(); lg.gain.value = 0.02;
    lfo.connect(lg); lg.connect(dg.gain); lfo.start();
    drone = { o2 };
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, when, slideTo) {
  if (!AC || !soundOn) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + (when || 0);
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.07, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) { /* audio is optional */ }
}
const sfx = {
  turn() { tone(520, 0.3, 'sine', 0.06, 0, 140); if (AC && drone) drone.o2.frequency.setTargetAtTime(plane === 'B' ? 110 : 82.6, AC.currentTime, 0.3); },
  refuse() { tone(110, 0.18, 'triangle', 0.08, 0, 80); },
  chime() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 1.4, 'sine', 0.05, i * 0.13)); },
  open() { tone(392, 1.1, 'sine', 0.05, 0); tone(587, 1.3, 'sine', 0.04, 0.1); },
  enter() { tone(330, 0.9, 'sine', 0.05, 0, 660); },
  back() { tone(260, 0.6, 'triangle', 0.07, 0, 90); }
};

/* ---------- UI helpers ---------- */
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
let toastTimer = 0;
function toast(msg) {
  const n = $('toast'); n.textContent = msg; n.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => n.classList.remove('on'), 2800);
}
function renderTicks() {
  const box = $('ticks'); box.replaceChildren();
  frags.forEach(f => box.append(el('span', 'tick' + (f ? ' on' : ''))));
  box.setAttribute('aria-label', 'Notes found: ' + frags.filter(Boolean).length + ' of 5');
}
function showCard(spec) {
  const card = $('card'); card.replaceChildren();
  if (spec.eyebrow) card.append(el('div', 'eyebrow', spec.eyebrow));
  if (spec.title) card.append(el('h2', 'ctitle', spec.title));
  if (spec.note) card.append(el('p', 'note', spec.note));
  if (spec.text) card.append(el('p', 'copy', spec.text));
  if (spec.small) card.append(el('p', 'copy dim', spec.small));
  if (spec.form) {
    const f = document.createElement('form');
    const lab = el('label', 'eyebrow', 'Her name'); lab.htmlFor = 'nameInput';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.id = 'nameInput'; inp.maxLength = 24; inp.autocomplete = 'off'; inp.placeholder = 'Anything will do';
    const b = el('button', 'btn', 'Give it to her'); b.type = 'submit';
    f.append(lab, inp, b);
    f.addEventListener('submit', ev => { ev.preventDefault(); const nm = inp.value.trim().slice(0, 24); hideCard(); replyCard(nm); });
    card.append(f);
  }
  if (spec.button) {
    const b = el('button', 'btn', spec.button); b.type = 'button';
    b.addEventListener('click', () => { hideCard(); if (spec.onClose) spec.onClose(); });
    card.append(b);
  }
  $('overlay').hidden = false;
  mode = 'card';
  requestAnimationFrame(() => { const f = card.querySelector('input,button'); if (f) f.focus({ preventScroll: true }); });
}
function hideCard() { $('overlay').hidden = true; }

/* ---------- level flow ---------- */
function loadLevel(i) {
  li = i; L = LEVELS[i]; walls = BORDER.concat(L.walls);
  child.x = L.start[0]; child.y = L.start[1];
  plane = 'A'; blend = 0; target = null; stuck = 0; pressure = 0; shake = 0;
  portalOpen = !!(frags[i] && L.portal);
  trail.length = 0;
  $('lvl').textContent = L.name;
  $('hint').textContent = L.hint;
  $('side').textContent = 'Near';
  renderTicks();
}
function startFade(fn) { mode = 'fade'; fadeDir = 1; pending = fn; target = null; }

function collect() {
  frags[li] = true; renderTicks(); sfx.chime(); mode = 'card'; target = null;
  const last = li === 4;
  setTimeout(() => showCard({
    eyebrow: 'A note, folded small',
    note: L.note,
    button: last ? 'Answer her' : 'Fold it away',
    onClose: () => {
      if (last) { nameCard(); }
      else { portalOpen = true; mode = 'play'; sfx.open(); toast('A door has opened.'); }
    }
  }), 500);
}
function nameCard() {
  showCard({ eyebrow: 'What will you call her?', text: 'She is listening. Whatever you say, she will keep.', form: true });
}
function replyCard(nm) {
  const wren = nm.toLowerCase() === 'wren';
  const note = wren ? 'Wren. How did you know that?'
    : nm ? nm + '. That is not it. It will do very well.'
    : 'No name at all. That is allowed too. It will do very well.';
  showCard({
    eyebrow: 'She answers', note, text: 'Go on. I have the door.', button: 'Continue',
    onClose: () => endCard(wren)
  });
}
function endCard(wren) {
  showCard({
    eyebrow: 'The end',
    note: 'Somewhere behind you, a small light has come on.',
    text: wren ? 'You called her what she had always been called. She will keep listening for you.'
      : 'Her name was Wren all along. She only wanted to hear what you would call her.',
    button: 'Begin again',
    onClose: () => { frags.fill(false); loadLevel(0); mode = 'play'; }
  });
}
function titleCard() {
  showCard({
    eyebrow: 'A game in five rooms',
    title: 'Wren, Folded',
    text: 'Something small is moving in the room behind the room. It has been trying to reach you for a while.',
    small: 'Tap, click or use the arrow keys to walk. Press Space to turn the room over.',
    button: 'Begin',
    onClose: () => { initAudio(); mode = 'play'; }
  });
}

/* ---------- movement and turning ---------- */
function hit(x, y, half, pl) {
  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    if (w[4].indexOf(pl) !== -1 && x + half > w[0] && x - half < w[0] + w[2] && y + half > w[1] && y - half < w[1] + w[3]) return true;
  }
  return false;
}
function turn() {
  if (mode !== 'play') return;
  const np = plane === 'A' ? 'B' : 'A';
  if (hit(child.x, child.y, 7, np)) { shake = 7; sfx.refuse(); toast('Something is already there, on the other side.'); return; }
  plane = np; sfx.turn();
  $('side').textContent = plane === 'A' ? 'Near' : 'Far';
}
function foldBack() {
  child.x = L.start[0]; child.y = L.start[1]; plane = 'A'; target = null; pressure = 0; shake = 8; trail.length = 0;
  $('side').textContent = 'Near'; sfx.back();
  toast('The far light held you too long. You are back at the start of the room.');
}

/* ---------- simulation ---------- */
const dust = Array.from({ length: 42 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 6, vy: -3 - Math.random() * 8, r: 0.8 + Math.random() * 1.6 }));

function update(dt) {
  t += dt;
  const bt = plane === 'B' ? 1 : 0, rate = reduce ? 9 : 1.9;
  if (blend < bt) blend = Math.min(bt, blend + dt * rate); else if (blend > bt) blend = Math.max(bt, blend - dt * rate);
  shake *= Math.pow(0.02, dt);
  if (fadeDir > 0) {
    fade += dt / 0.5;
    if (fade >= 1) { fade = 1; fadeDir = -1; if (pending) { const f = pending; pending = null; f(); } }
  } else if (fadeDir < 0) {
    fade -= dt / 0.5;
    if (fade <= 0) { fade = 0; fadeDir = 0; if (mode === 'fade') mode = 'play'; }
  }
  for (const d of dust) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; }
    if (d.x < -4) d.x = W + 4; if (d.x > W + 4) d.x = -4;
  }
  if (mode !== 'play') return;

  let vx = 0, vy = 0;
  if (keys.left) vx -= 1; if (keys.right) vx += 1; if (keys.up) vy -= 1; if (keys.down) vy += 1;
  const keyed = vx || vy;
  if (keyed) { target = null; const m = Math.hypot(vx, vy); vx /= m; vy /= m; }
  else if (target) {
    const dx = target.x - child.x, dy = target.y - child.y, d = Math.hypot(dx, dy);
    if (d < 3) target = null; else { vx = dx / d; vy = dy / d; }
  }
  const sp = 150, ox = child.x, oy = child.y;
  child.x += vx * sp * dt; if (hit(child.x, child.y, 6, plane)) child.x = ox;
  child.y += vy * sp * dt; if (hit(child.x, child.y, 6, plane)) child.y = oy;
  const moved = Math.hypot(child.x - ox, child.y - oy);
  if (target) {
    if (moved < sp * dt * 0.2) { stuck += dt; if (stuck > 0.3) { target = null; stuck = 0; } } else stuck = 0;
  }
  if (moved > 0.01) { trail.unshift({ x: ox, y: oy }); if (trail.length > 16) trail.pop(); }
  else if (trail.length) trail.pop();

  if (L.pressure) {
    pressure = clamp(pressure + (plane === 'B' ? 0.42 : -0.7) * dt, 0, 1);
    if (pressure >= 1) { foldBack(); return; }
  }
  const f = L.frag;
  if (!frags[li] && f.p.indexOf(plane) !== -1 && Math.hypot(child.x - f.x, child.y - f.y) < 18) { collect(); return; }
  if (portalOpen && L.portal) {
    const p = L.portal;
    if (Math.abs(child.x - p.x) < 17 + 4 && Math.abs(child.y - p.y) < 29 + 2) {
      sfx.enter();
      startFade(() => loadLevel(li + 1));
    }
  }
}

/* ---------- drawing ---------- */
const TV = [];
for (let i = 0; i < 16; i++) TV.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1, i & 8 ? 1 : -1]);
const TE = [];
for (let i = 0; i < 16; i++) for (let b = 0; b < 4; b++) { const j = i ^ (1 << b); if (j > i) TE.push([i, j]); }

function drawTesseract(lc) {
  const a = reduce ? 0.6 : t * 0.16, b = reduce ? 0.4 : t * 0.11, g = reduce ? 0.2 : t * 0.07;
  const pts = TV.map(v => {
    let x = v[0], y = v[1], z = v[2], w = v[3], c = Math.cos(a), s = Math.sin(a);
    let x1 = x * c - w * s, w1 = x * s + w * c;
    c = Math.cos(b); s = Math.sin(b);
    const y1 = y * c - z * s; let z1 = y * s + z * c;
    c = Math.cos(g); s = Math.sin(g);
    const z2 = z1 * c - w1 * s, w2 = z1 * s + w1 * c;
    const d4 = 5 / (5 - w2), X = x1 * d4, Y = y1 * d4, Z = z2 * d4, d3 = 6 / (6 - Z);
    return [400 + X * d3 * 110, 250 + Y * d3 * 110];
  });
  ctx.lineWidth = 1.2; ctx.strokeStyle = rgba(lc, 0.13);
  ctx.beginPath();
  for (const e of TE) { ctx.moveTo(pts[e[0]][0], pts[e[0]][1]); ctx.lineTo(pts[e[1]][0], pts[e[1]][1]); }
  ctx.stroke();
}

function drawDoor(d, open, k, lc) {
  const w = 34, h = 58, x = d.x - w / 2, y = d.y - h / 2;
  ctx.beginPath();
  ctx.moveTo(x, y + h); ctx.lineTo(x, y + w / 2); ctx.arc(d.x, y + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath();
  if (open) {
    const pulse = 0.8 + 0.2 * Math.sin(t * 2.2);
    const sp = ctx.createRadialGradient(d.x, d.y, 4, d.x, d.y, 90);
    sp.addColorStop(0, 'rgba(255,170,90,' + (0.32 * pulse) + ')'); sp.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = sp; ctx.fillRect(d.x - 90, d.y - 90, 180, 180);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'rgba(255,205,130,0.95)'); g.addColorStop(1, 'rgba(255,140,60,0.35)');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = rgba(mixHex('#ffd7a0', '#9a3d06', k), 1); ctx.lineWidth = 1.6; ctx.stroke();
  } else {
    ctx.setLineDash([4, 4]); ctx.strokeStyle = rgba(lc, 0.4); ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawWatcher(wt, k, lc) {
  const vis = 0.07 + 0.93 * k, x = wt.x + Math.sin(t * 0.5) * 2, y = wt.y, h = wt.h;
  ctx.save(); ctx.globalAlpha = vis; ctx.lineCap = 'round';
  const g = ctx.createLinearGradient(0, y - h, 0, y);
  g.addColorStop(0, rgba(lc, 1)); g.addColorStop(1, rgba(lc, 0));
  ctx.strokeStyle = g; ctx.lineWidth = Math.max(2, h * 0.018);
  ctx.beginPath(); ctx.moveTo(x, y - h + h * 0.07); ctx.lineTo(x, y); ctx.stroke();
  ctx.fillStyle = rgba(lc, 1); ctx.beginPath(); ctx.ellipse(x, y - h + h * 0.035, h * 0.03, h * 0.04, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = rgba(lc, 1); ctx.lineWidth = Math.max(1.4, h * 0.01);
  ctx.beginPath();
  ctx.moveTo(x, y - h * 0.84); ctx.quadraticCurveTo(x - h * 0.09, y - h * 0.62, x - h * 0.075, y - h * 0.38);
  ctx.moveTo(x, y - h * 0.84); ctx.quadraticCurveTo(x + h * 0.09, y - h * 0.62, x + h * 0.075, y - h * 0.42);
  ctx.stroke();
  const lit = li === 4 && frags[4], lx = x + h * 0.075, ly = y - h * 0.4;
  if (lit) {
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 46);
    lg.addColorStop(0, 'rgba(255,190,100,0.8)'); lg.addColorStop(1, 'rgba(255,190,100,0)');
    ctx.fillStyle = lg; ctx.fillRect(lx - 46, ly - 46, 92, 92);
  }
  ctx.fillStyle = lit ? 'rgba(255,214,150,1)' : 'rgba(255,162,77,0.3)';
  ctx.beginPath(); ctx.arc(lx, ly, Math.max(2.5, h * 0.012), 0, 7); ctx.fill();
  ctx.restore();
}

function draw() {
  const s = canvas.width / W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  const k = blend < 0.5 ? 2 * blend * blend : 1 - Math.pow(-2 * blend + 2, 2) / 2;
  const bgc = mixHex(COL.A.bg, COL.B.bg, k), lc = mixHex(COL.A.line, COL.B.line, k);
  ctx.fillStyle = rgba(bgc, 1); ctx.fillRect(0, 0, W, H);
  stage.style.borderColor = rgba(lc, 0.38);

  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawTesseract(lc);

  // creases
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(lc, 0.07);
  ctx.beginPath(); ctx.moveTo(0, 330); ctx.lineTo(520, 0); ctx.moveTo(270, 500); ctx.lineTo(800, 170); ctx.stroke();

  // dust
  ctx.fillStyle = rgba(lc, 0.3);
  for (const d of dust) { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill(); }

  // walls
  const sol = p => Math.min(1, (p.indexOf('A') !== -1 ? 1 - k : 0) + (p.indexOf('B') !== -1 ? k : 0));
  const fillC = mixArr(bgc, lc, 0.2);
  for (const w of walls) {
    const x = w[0], y = w[1], ww = w[2], hh = w[3], sv = sol(w[4]);
    if (sv > 0.02) {
      ctx.fillStyle = rgba(fillC, sv); ctx.fillRect(x, y, ww, hh);
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, ww, hh); ctx.clip();
      ctx.strokeStyle = rgba(lc, 0.22 * sv); ctx.lineWidth = 1; ctx.beginPath();
      for (let d = -hh; d < ww; d += 9) { ctx.moveTo(x + d, y + hh); ctx.lineTo(x + d + hh, y); }
      ctx.stroke(); ctx.restore();
      ctx.strokeStyle = rgba(lc, 0.9 * sv); ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.75, y + 0.75, ww - 1.5, hh - 1.5);
    }
    if (sv < 0.98) {
      ctx.setLineDash([4, 5]); ctx.strokeStyle = rgba(lc, 0.34 * (1 - sv)); ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, ww, hh); ctx.setLineDash([]);
    }
  }

  // doors
  if (L.portal) drawDoor(L.portal, portalOpen, k, lc);
  if (L.door) drawDoor(L.door, true, k, lc);

  // watcher
  if (L.watcher) drawWatcher(L.watcher, k, lc);

  // note fragment
  if (!frags[li]) {
    const f = L.frag, sv = sol(f.p), fy = f.y + Math.sin(t * 2) * 3;
    if (sv > 0.02) {
      const gl = ctx.createRadialGradient(f.x, fy, 0, f.x, fy, 42);
      gl.addColorStop(0, 'rgba(255,190,100,' + (0.55 * sv) + ')'); gl.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = gl; ctx.fillRect(f.x - 42, fy - 42, 84, 84);
      ctx.save(); ctx.translate(f.x, fy); ctx.rotate(t * 0.8);
      ctx.fillStyle = rgba(mixHex('#ffe6a8', '#b8430a', k), sv);
      ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(7, 0); ctx.lineTo(0, 9); ctx.lineTo(-7, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgba(lc, 0.8 * sv); ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }
    if (sv < 0.98) {
      ctx.save(); ctx.translate(f.x, fy); ctx.rotate(t * 0.8); ctx.setLineDash([3, 3]);
      ctx.strokeStyle = rgba(lc, 0.5 * (1 - sv)); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(7, 0); ctx.lineTo(0, 9); ctx.lineTo(-7, 0); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
  }

  // child
  const pulse = 0.85 + 0.15 * Math.sin(t * 3);
  const cg = ctx.createRadialGradient(child.x, child.y, 0, child.x, child.y, 80);
  cg.addColorStop(0, 'rgba(255,175,95,' + (0.42 * pulse) + ')'); cg.addColorStop(1, 'rgba(255,175,95,0)');
  ctx.fillStyle = cg; ctx.fillRect(child.x - 80, child.y - 80, 160, 160);
  for (let i = 0; i < trail.length; i++) {
    const a = 0.4 * (1 - i / trail.length);
    ctx.fillStyle = 'rgba(255,162,77,' + a + ')';
    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y + 4, 2.4 * (1 - i / trail.length) + 0.4, 0, 7); ctx.fill();
  }
  const sx = reduce ? 1 : 0.12 + 0.88 * Math.abs(Math.cos(Math.PI * blend));
  ctx.save(); ctx.translate(child.x, child.y); ctx.scale(sx, 1);
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(lc, 0.95);
  ctx.fillStyle = '#ffa24d';
  ctx.beginPath(); ctx.moveTo(-6.5, 10); ctx.lineTo(6.5, 10); ctx.lineTo(2.2, -1); ctx.lineTo(-2.2, -1); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffe2b8';
  ctx.beginPath(); ctx.arc(0, -5.2, 4.6, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff6d6'; ctx.beginPath(); ctx.arc(8, 4, 2.4, 0, 7); ctx.fill();
  ctx.restore();

  // far-side pressure ring
  if (L.pressure && pressure > 0.01) {
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(lc, 0.2); ctx.beginPath(); ctx.arc(child.x, child.y, 19, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = pressure > 0.7 ? '#ff5a3c' : '#ffa24d';
    ctx.beginPath(); ctx.arc(child.x, child.y, 19, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pressure); ctx.stroke();
  }
  ctx.restore();

  if (fade > 0) { ctx.fillStyle = rgba(bgc, fade); ctx.fillRect(0, 0, W, H); }
}

/* ---------- input ---------- */
function setTarget(e) {
  if (mode !== 'play') return;
  const r = canvas.getBoundingClientRect();
  target = { x: clamp((e.clientX - r.left) / r.width * W, 26, W - 26), y: clamp((e.clientY - r.top) / r.height * H, 26, H - 26) };
  stuck = 0;
}
canvas.addEventListener('pointerdown', setTarget);
canvas.addEventListener('pointermove', e => { if (e.buttons) setTarget(e); });

const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const m = KEYMAP[e.key];
  if (m) { keys[m] = true; if (mode === 'play') e.preventDefault(); return; }
  if ((e.key === ' ' || e.key === 'e' || e.key === 'E') && tag !== 'BUTTON') { e.preventDefault(); turn(); }
});
addEventListener('keyup', e => { const m = KEYMAP[e.key]; if (m) keys[m] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

$('turnBtn').addEventListener('click', () => { turn(); });
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? 'Sound on' : 'Sound off';
  $('soundBtn').setAttribute('aria-pressed', String(soundOn));
  if (AC && master) master.gain.setTargetAtTime(soundOn ? 0.9 : 0, AC.currentTime, 0.1);
});

/* ---------- sizing and loop ---------- */
function resize() {
  const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(2, Math.round(r.width * dpr));
  canvas.height = Math.max(2, Math.round(r.width * dpr * H / W));
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}

loadLevel(0);
titleCard();
requestAnimationFrame(frame);
})();
</script>

</body></html>
